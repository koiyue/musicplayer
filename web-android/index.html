<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MusicHub</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="/m/style.css">
</head>
<body>

<header id="top">
  <div id="brand">MusicHub<span id="ver"></span></div>
  <div class="top-actions">
    <button id="login-open" type="button">登录</button>
    <button id="search-open" type="button">搜索</button>
  </div>
</header>

<nav id="sources"></nav>

<main id="view"><div class="loading">加载中…</div></main>

<div id="pullhint" class="hidden">下拉加载更多推荐</div>

<section id="player" class="hidden">
  <div id="pbar"><div id="pfill"></div></div>
  <div class="prow">
    <div id="pcover" class="ph">♪</div>
    <div class="pmeta">
      <div id="ptitle">未在播放</div>
      <div id="partist">—</div>
    </div>
    <button id="pprev" type="button">◀◀</button>
    <button id="ptoggle" type="button">▶</button>
    <button id="pnext" type="button">▶▶</button>
    <button id="pqueue" type="button">☰</button>
  </div>
  <div class="ptime"><span id="ptcur">0:00</span><span id="ptdur">0:00</span></div>
</section>

<div id="searchpage" class="page hidden">
  <div class="sbar">
    <input id="sinput" type="search" placeholder="搜索歌曲 / 歌手" autocomplete="off" enterkeyhint="search">
    <button id="sback" type="button">取消</button>
  </div>
  <div id="sresults" class="list"></div>
</div>

<div id="videopage" class="page hidden">
  <div class="vtop">
    <button id="video-back" type="button">‹ 返回</button>
    <span id="video-title"></span>
  </div>
  <div class="vwrap"><video id="vid" muted playsinline></video></div>
  <div class="vhint">画面静音同步播放，声音由播放器输出</div>
</div>

<div id="loginpage" class="sheet hidden">
  <div class="sheet-head"><b>登录</b><button id="login-close" type="button">✕</button></div>
  <div id="login-body" class="login-body"></div>
</div>

<div id="sheet" class="sheet hidden">
  <div class="sheet-head"><b>播放队列</b><button id="sheet-close" type="button">✕</button></div>
  <div id="queue-list" class="list"></div>
</div>

<div id="menu" class="sheet hidden">
  <div class="sheet-head"><b id="menu-title">操作</b><button id="menu-close" type="button">✕</button></div>
  <div id="menu-body" class="menu-body"></div>
</div>

<div id="toast" class="hidden"></div>
<audio id="audio" preload="none"></audio>
<script src="/m/app.js"></script>
</body>
</html>
